
name: CI Pipeline

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test project files
        run: |
          test -s index.html
          test -s style.css
          test -s script.js
          grep -q "style.css" index.html
          grep -q "script.js" index.html

      - name: Build project
        run: |
          mkdir -p dist
          cp index.html style.css script.js dist/

      - name: Verify build
        run: test -s dist/index.html
